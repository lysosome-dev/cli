version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    # release.yml is generated by cargo-dist (`dist generate`); bump
    # cargo-dist-version in dist-workspace.toml instead. A hand-edited
    # release.yml makes `dist plan` fail in the release workflow.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        patterns: ["*"]
