# Publishes lysosome-core, then lysosome, to crates.io.
#
# Called by release.yml (generated by cargo-dist from `publish-jobs` in
# dist-workspace.toml) after the GitHub Release is created.
# * Without the CARGO_REGISTRY_TOKEN secret it logs a notice and succeeds.
# * A version already on crates.io is skipped, so re-running is safe.
# * It fails (the release run goes red; the GitHub Release itself is already
#   out) when the tag isn't exactly v<version in Cargo.toml> or crates.io
#   can't be reached after retries. Fix the cause and re-run the job.
#
# Manual run: Actions -> "Publish crates" -> Run workflow, with a release tag
# (vX.Y.Z) as the ref. Only tags that contain this file (releases after
# 0.2.1) can be picked; publish older versions by hand with `cargo publish`.
# Manual runs refuse prerelease versions, matching release.yml, since a
# crates.io upload can't be undone.
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        description: The dist manifest (JSON) from release.yml's plan job
        required: true
        type: string
  workflow_dispatch:

# No `permissions:` block: when called from release.yml this job gets the
# caller's permissions (contents: read, set by github-custom-job-permissions
# in dist-workspace.toml; a nested workflow may not ask for more). It only
# reads the repository and talks to crates.io with its own token.

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      EVENT_NAME: ${{ github.event_name }}
    # The token is only handed to the two steps that need it, never to
    # third-party actions.
    steps:
      - name: Check for a crates.io token
        id: token
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A manual run exists to publish; don't let it go green doing nothing.
            echo "::error::CARGO_REGISTRY_TOKEN is not set as a repository secret."
            exit 1
          else
            echo "::notice title=crates.io publish skipped::CARGO_REGISTRY_TOKEN is not set, so lysosome-core and lysosome were not published to crates.io."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      # No toolchain action: rust-toolchain.toml pins `stable`, which rustup
      # on the runner installs on first use.
      - name: Check the tag and versions
        id: check
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v?* ]]; then
            echo "::error::Refusing to publish: $GITHUB_REF is not a vX.Y.Z release tag."
            exit 1
          fi
          tag_version=${GITHUB_REF#refs/tags/v}
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ "$tag_version" == *-* ]]; then
              echo "::error::Refusing to publish prerelease $tag_version from a manual run."
              exit 1
            fi
            # release.yml only calls this after creating the Release; a manual
            # run must not publish a version whose release never shipped.
            if ! gh release view "v$tag_version" -R "$GITHUB_REPOSITORY" >/dev/null; then
              echo "::error::Refusing to publish: there is no GitHub Release for v$tag_version."
              exit 1
            fi
          fi
          # Check every crate before publishing any, so a mismatch can't
          # leave a half-published release.
          meta=$(cargo metadata --no-deps --format-version 1)
          for crate in lysosome-core lysosome; do
            version=$(jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version' <<<"$meta")
            if [ "$version" != "$tag_version" ]; then
              echo "::error::Refusing to publish: $crate is at version '$version' but the tag is v$tag_version."
              exit 1
            fi
          done
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
      - name: Publish lysosome-core, then lysosome
        if: steps.token.outputs.present == 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail
          # Dependency order: the CLI depends on lysosome-core by version.
          for crate in lysosome-core lysosome; do
            rc=0
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              --connect-timeout 10 --max-time 30 \
              --retry 4 --retry-all-errors --retry-delay 5 \
              -A "lysosome-release (https://github.com/lysosome-dev/cli)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION") || rc=$?
            case "$status" in
              200)
                echo "$crate $VERSION is already on crates.io; skipping."
                ;;
              404)
                echo "Publishing $crate $VERSION"
                # cargo waits until the new version is in the index, so the
                # next crate can resolve it.
                cargo publish --locked -p "$crate"
                ;;
              *)
                echo "::error::Couldn't tell whether $crate $VERSION is on crates.io (HTTP $status, curl exit $rc, after retries). Re-run this job later."
                exit 1
                ;;
            esac
          done
