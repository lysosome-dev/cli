# Publishes lysosome-core, then lysosome, to crates.io.
#
# Called by release.yml (generated by cargo-dist from `publish-jobs` in
# dist-workspace.toml) after the GitHub Release is created. It never fails a
# release for lack of a token: without the CARGO_REGISTRY_TOKEN secret it
# logs a notice and skips. Re-running is safe: a version already on
# crates.io is skipped.
#
# Manual run (e.g. after adding the token for a release that already
# shipped): Actions -> "Publish crates" -> Run workflow, and pick the release
# tag (vX.Y.Z) as the ref. Any other ref, or a tag that doesn't match the
# version in Cargo.toml, is refused, since a crates.io upload can't be undone.
name: Publish crates

on:
  workflow_call:
    inputs:
      plan:
        description: The dist manifest (JSON) from release.yml's plan job
        required: true
        type: string
  workflow_dispatch:

# No `permissions:` block: when called from release.yml this job gets the
# caller's permissions (contents: read, set by github-custom-job-permissions
# in dist-workspace.toml; a nested workflow may not ask for more). It only
# reads the repository and talks to crates.io with its own token.

jobs:
  publish-crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check for a crates.io token
        id: token
        shell: bash
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice title=crates.io publish skipped::CARGO_REGISTRY_TOKEN is not set, so lysosome-core and lysosome were not published to crates.io."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: steps.token.outputs.present == 'true'
      - name: Publish lysosome-core, then lysosome
        if: steps.token.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Only publish a release tag whose name matches the crate versions.
          cli_version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "lysosome") | .version')
          if [ "$GITHUB_REF" != "refs/tags/v$cli_version" ]; then
            echo "::error::Refusing to publish: ref is $GITHUB_REF, expected refs/tags/v$cli_version (the version in Cargo.toml)."
            exit 1
          fi
          # Dependency order: the CLI depends on lysosome-core by version.
          for crate in lysosome-core lysosome; do
            version=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg c "$crate" '.packages[] | select(.name == $c) | .version')
            if [ -z "$version" ] || [ "$version" = "null" ]; then
              echo "::error::No version found for $crate in Cargo metadata."
              exit 1
            fi
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "lysosome-release (https://github.com/lysosome-dev/cli)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200)
                echo "$crate $version is already on crates.io; skipping."
                continue
                ;;
              404)
                echo "Publishing $crate $version"
                # cargo waits until the new version is in the index, so the
                # next crate can resolve it.
                cargo publish --locked -p "$crate"
                ;;
              *)
                echo "::error::crates.io answered HTTP $status for $crate $version; not sure whether it is published. Re-run this job later."
                exit 1
                ;;
            esac
          done
