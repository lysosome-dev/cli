name: Bug report
description: Something lysosome did (or labelled) wrong
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If lysosome **deleted, moved or labelled `REMOVABLE`** something it shouldn't have (uncommitted work, unpushed commits, tracked files, anything outside the scanned folders), that's a safety bug: please report it privately through [security advisories](https://github.com/lysosome-dev/cli/security/advisories/new) instead.

        **Privacy:** `--json` output and logs contain your folder paths, repo and branch names. Redact anything you don't want public (e.g. replace `/Users/jane/clients/acme` with `/Users/me/code/project`) before pasting.
  - type: input
    id: version
    attributes:
      label: lysosome version
      description: Output of `lysosome --version`
      placeholder: lysosome 0.2.1 (abc123def aarch64-apple-darwin)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 15.4 (Apple silicon), Ubuntu 24.04 (x86_64)
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Homebrew
        - Install script (lysosome.dev/install.sh)
        - Prebuilt binary from GitHub Releases
        - cargo install
        - Built from source
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
      placeholder: lysosome scan ~/code --days 60
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: json
    attributes:
      label: Relevant `--json` output
      description: |
        Re-run the command with `--json` and paste just the findings involved (e.g. `lysosome scan --json | jq '.findings[] | select(.path | contains("myrepo"))'`). **Redact paths and names you don't want public.**
      render: json
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Steps to reproduce, `git worktree list` output, screenshots, entries from the actions log for `clean`...
