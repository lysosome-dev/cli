[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist): https://axodotdev.github.io/cargo-dist/
# Regenerate .github/workflows/release.yml after editing: `dist generate`
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app. `lysosome-installer.sh` is what
# https://lysosome.dev/install.sh redirects to, so keep the shell installer.
# The Homebrew formula (`lysosome.rb`) is uploaded as a release asset only;
# lysosome-dev/homebrew-tap pulls new releases itself on a schedule.
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# dist has no universal macOS binary; the installers and Homebrew pick the
# right architecture per machine.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-musl",
]
# Where the shell installer puts the binary (override with LYSOSOME_INSTALL_DIR)
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
# Whether to install an updater program
install-updater = false
# Man pages and shell completions, generated by .github/build-setup.yml
# right before `dist build` (run `scripts/dist-extras.sh` to build them locally)
include = ["target/dist-extras/man/", "target/dist-extras/completions/"]
github-build-setup = "../build-setup.yml"
# TEMP: build all artifacts on PRs to validate the matrix
pr-run-mode = "upload"
