[package]
name = "lysosome"
description = "Find and safely reclaim the disk your dev tools and coding agents leave behind"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://github.com/lysosome-dev/cli#readme"
readme = "../../README.md"
keywords = ["disk-cleanup", "git-worktree", "cache", "disk-usage", "cli"]
categories = ["command-line-utilities", "filesystem", "development-tools"]
# Tests need the repo's tests/fixtures/ and schema/, so they stay out of the
# published crate. build.rs embeds the commit for `--version`
# (from .cargo_vcs_info.json when built from crates.io).
include = ["src/**/*.rs", "build.rs", "LICENSE"]

[[bin]]
name = "lysosome"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
# Raw key reads for `clean --interactive` (already in the tree via indicatif).
console = { version = "0.16", default-features = false, features = ["std", "ansi-parsing"] }
dirs = "7"
indicatif = "0.18"
libc = "0.2"
lysosome-core = { path = "../lysosome-core", version = "0.3.0" }
owo-colors = "4.4"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.2"
jsonschema = { version = "0.58", default-features = false }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
