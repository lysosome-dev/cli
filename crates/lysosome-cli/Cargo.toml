[package]
name = "lysosome"
description = "Find and safely reclaim the disk your dev tools and coding agents leave behind"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["disk", "cleanup", "git", "worktree", "cli"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "lysosome"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
clap_complete = "4.6"
clap_mangen = "0.3"
dirs = "6"
indicatif = "0.18"
lysosome-core = { path = "../lysosome-core", version = "0.1.0" }
owo-colors = "4.4"
serde_json = "1"

[dev-dependencies]
assert_cmd = "2.2"
jsonschema = { version = "0.38", default-features = false }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
