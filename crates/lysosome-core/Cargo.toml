[package]
name = "lysosome-core"
description = "Discovery, analysis, sizing and classification engine for lysosome"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
documentation = "https://docs.rs/lysosome-core"
readme = "README.md"
keywords = ["disk-usage", "cleanup", "git-worktree", "cache", "developer-tools"]
categories = ["filesystem", "development-tools"]
# Tests need the repo's tests/fixtures/ scripts, so they stay out of the
# published crate.
include = ["src/**/*.rs", "README.md", "LICENSE"]

[dependencies]
humantime = "2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
thiserror = "2"
trash = "5.2"
wait-timeout = "0.2"

# The Trash location `NSFileManager` reports (already in the tree via `trash`).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = "3"
