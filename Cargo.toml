[workspace]
resolver = "2"
members = ["crates/lysosome-core", "crates/lysosome-cli"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lysosome-dev/cli"
homepage = "https://lysosome.dev"
authors = ["Scott Havird <scott.havird@gmail.com>"]
rust-version = "1.85"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
